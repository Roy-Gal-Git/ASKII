[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "askii"
version = "0.1.0"
description = "CLI tool that answers natural-language questions about codebases using RAG"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ASKII Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "strands-agents[gemini]",
    "strands-agents-tools",
    "chromadb",
    "google-genai",
    "tiktoken",
    "gitpython",
    "yaspin",
    "python-dotenv",
    "pydantic",
    "pathspec",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
askii = "app:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["app"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:strands.experimental.hooks",
    "ignore::DeprecationWarning:google.genai.types",
]

